<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>小猴桌宠</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage {
      position: absolute; inset: 0;
      cursor: grab;
      touch-action: none;   /* 保证指针事件不被浏览器手势打断 */
    }
    #stage:active { cursor: grabbing; }

    /* ---- 可插值的自定义属性（酒瓶用）----
       默认情况下自定义属性是"离散"的：写 transition 也只会在中间某一刻硬跳。
       用 @property 注册成具体类型之后，它们才会像普通属性一样逐帧插值。
       酒瓶离不开这一条：液面要始终保持水平，就得反向补偿瓶身角度，
       而"补偿用的角度"必须是正在动画中的那个角度，不能是终点值。 */
    @property --tilt  { syntax: '<angle>';      inherits: true;  initial-value: 12deg; }
    /* 仰头角（#lean 那一层的自转）。酒液要读出**正在动画中的**这一层角度，
       才能把它一起补偿掉 —— 所以它必须是个注册过的变量，而不是写死的 transform。 */
    @property --leanA { syntax: '<angle>';      inherits: true;  initial-value: 0deg; }
    @property --leanY { syntax: '<percentage>'; inherits: true;  initial-value: 0%; }
    @property --leanS { syntax: '<number>';     inherits: true;  initial-value: 1; }
    @property --slosh { syntax: '<angle>';      inherits: false; initial-value: 0deg; }
    @property --pour  { syntax: '<number>';     inherits: true;  initial-value: 0; }
    @property --dy    { syntax: '<percentage>'; inherits: true;  initial-value: 5%; }
    @property --sip   { syntax: '<number>';     inherits: true;  initial-value: 0; }
    /* 酒量变化用"一仰脖吞下去"的速度，不是液面匀速滑落 */
    body { transition: --sip .7s ease; }

    /* 伪 3D 透视倾斜层（JS 每帧更新 transform） */
    #tilt { position: absolute; inset: 0; will-change: transform; }

    /* 步态/挤压层：走路起伏、落地压扁、拖拽悬垂都由 JS 每帧写 transform。
       支点固定在脚底（--foot 由角色档案给），所以旋转和挤压都是"绕脚"发生的，
       看起来像踩在地上，而不是整个人在画布中心扭。 */
    #gait {
      position: absolute; inset: 0;
      transform-origin: 50% var(--foot, 99.5%);
      will-change: transform;
    }

    /* 姿态层：醉拳摇摆 / 瞌睡点头 / 忧郁垮肩。
       单独一层，避免和 #tilt(鼠标透视)、#breath(呼吸) 抢同一个 transform */
    #pose { position: absolute; inset: 0; transform-origin: 50% 94%; will-change: transform; }

    /* 前倾/仰头层：仰头灌酒、吐烟仰头、呼气下沉。用 transition 而非 animation，
       所以"举瓶—仰头—放下"是一条连续的缓动曲线，不是硬切。

       角度/位移/压缩都走变量，而不是各自写死一条 transform —— 因为酒液在**下一层**，
       它要把这一层的自转补偿掉（液面只认重力）。变量会随过渡逐帧更新并向下继承，
       写死的 transform 则只有终点值，液面就会"跟着头一起歪"。
       顺序固定为 rotate → translateY → scaleY，和原来三条规则各自的顺序保持一致。 */
    #lean {
      position: absolute; inset: 0;
      transform-origin: 50% 96%;
      --leanA: 0deg; --leanY: 0%; --leanS: 1;
      transform: rotate(var(--leanA)) translateY(var(--leanY)) scaleY(var(--leanS));
      transition: --leanA .85s cubic-bezier(.3, .84, .35, 1),
                  --leanY .85s cubic-bezier(.3, .84, .35, 1),
                  --leanS .85s cubic-bezier(.3, .84, .35, 1);
    }
    body.sip      #lean { --leanA: -6.5deg; --leanY: 1.4%; }   /* 仰头灌 */
    body.tiltback #lean { --leanA: -3.2deg; --leanY: .5%; }    /* 吐烟轻仰 */
    body.slump    #lean { --leanY: 1.7%; --leanS: .98; }       /* 呼气下沉 */

    /* 呼吸动画层 */
    #breath {
      position: absolute; inset: 0;
      transform-origin: center bottom;
      animation: breathe 3.4s ease-in-out infinite;
      /* 描边 + 投影：压在复杂界面上也能看清轮廓 */
      filter: drop-shadow(0 0 1.2px rgba(0, 0, 0, .55)) drop-shadow(0 4px 10px rgba(0, 0, 0, .32));
    }
    /* 拖拽时加强轮廓，明确"我正被拿起" */
    body.dragging #breath {
      filter: drop-shadow(0 0 2px rgba(0, 0, 0, .9)) drop-shadow(0 10px 20px rgba(0, 0, 0, .5));
    }
    /* 呼吸只压不沉：translateY 会把整只（包括脚）往下推 2px，而素材脚底本来就
       贴着窗口最底一行，于是待机时脚也一直在被裁。缩放支点在 bottom，压扁本身
       就已经是"身体向脚的方向沉"，不需要再额外位移。 */
    @keyframes breathe {      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(0.97); }
    }

    /* ---- 单独的头层：让"头自己在动"成为可能 ----
       底层（#breath 里的 .f）永远是完整的一张图，所以下面永远不会有洞；
       这一层只是把同一张图再叠一遍，用蒙版只留脖子以上，然后旋转/下压。
       边界处用一小段渐变羽化，重叠区变成很淡的双影，看上去就是运动残影。
       切线和支点全部来自档案（anchors.headCut / headPivot）——换形象要重量，
       量法：找轮廓最窄的那一行就是脖子。 */
    #head {
      position: absolute; inset: 0;
      z-index: 2;
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events: none;
      transform-origin: var(--head-px, 57.3%) var(--head-py, 70.7%);
      /* 上半透明、下半透明 —— 百分号是相对本元素高度，也就是窗口高度 */
      -webkit-mask-image: linear-gradient(to bottom,
        #000 0 calc(var(--head-cut, 65.2%) - var(--head-feather, 3%)),
        transparent calc(var(--head-cut, 65.2%) + 1%));
      mask-image: linear-gradient(to bottom,
        #000 0 calc(var(--head-cut, 65.2%) - var(--head-feather, 3%)),
        transparent calc(var(--head-cut, 65.2%) + 1%));
    }
    body.head-on #head { opacity: 1; }
    /* 两层是有原因的：
       - #head  负责「位移 + 缩放」，支点在脖子上 → 头缩一下就是头朝脖子压下去（点头）
       - #headSpin 负责「旋转」，支点在**头心** → 绕自己转，轮廓不变形
       如果旋转也绕脖子转，整个头的轮廓会跟着平移出去约 18px，两条轮廓
       （转过的 + 没转过的）叠起来看，头就像"变宽了一圈"，而不是"歪了一下"。
       绕头心转则圆形轮廓几乎不动，只有耳朵和呆毛在转 —— 那才像歪头。 */
    #headSpin {
      position: absolute; inset: 0;
      transform-origin: var(--head-spx, 50%) var(--head-spy, 36%);
    }
    #head img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    body.faceLeft #head img { transform: scaleX(-1); }

    /* 所有帧叠在同一位置，靠 opacity 交叉淡入 => 动作连贯 */
    .f {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity .24s ease, transform .2s ease;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .f.active { opacity: 1; }

    /* 看向左侧：把右向帧水平镜像（素材没有左向帧） */
    body.faceLeft .f { transform: scaleX(-1); }

    /* 点击穿透模式提示 */
    body.clickthrough #stage { opacity: 0.8; cursor: default; }

    /* ---- 眩晕：从头皮上搬进眼睛里 ----
       这里原来还有一个"头顶转圈"的黄色螺旋（#swirl），挂在 #stage 下面 —— 也就是
       整个窗口的坐标系里。问题是它根本不在变换链里：#tilt / #gait / #pose / #lean /
       #breath 任何一层动，头会跑，螺旋不跑。而眩晕期间 #breath 上正挂着 dizzyWobble
       在左右晃，于是那个圈一直在头顶飘着、跟眼睛越离越远 —— 看着像"贴在屏幕上"的
       装饰，不像长在猴子身上的反应。
       现在螺旋搬进眼球里：位置和大小都用档案的 eyes.points（和眼球同一个锚点），
       .eye 的 overflow:hidden 负责裁切。所以"只在眼睛区域内显示"是结构保证的，
       不是靠调坐标凑出来的。
       只剩"身体在晃"这一层还在外层 —— 那是整只猴子的动，本来就该整只一起晃。 */
    @keyframes dizzySpin { to { transform: rotate(360deg); } }

    @keyframes dizzyWobble {
      0%, 100% { transform: rotate(-5deg) translateX(-2%); }
      50%      { transform: rotate(5deg)  translateX(2%); }
    }
    body.dizzy #breath { animation: dizzyWobble .42s ease-in-out infinite; }

    /* 空闲时偶尔小跳一下 */
    @keyframes hopUp {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      22%      { transform: translateY(-13%) scale(.97, 1.04); }
      55%      { transform: translateY(0) scale(1.03, .97); }
      72%      { transform: translateY(-5%) scale(1, 1); }
    }
    body.hop #breath { animation: hopUp .62s ease-out; }

    /* ---- 眩晕眼：盖住原瞳孔的卡通眼球 + 里面的旋转螺旋 ----
       位置和大小不写死在这里，改由 character.json 的 eyes 生成（换形象要重量）。
       用椭圆而不是正圆：眼裂本来就比它高更宽，正圆总会有一头露出来。

       两点是"效果别跑偏"的关键：
       ① 居中靠 transform: translate(-50%, -50%)，所以**绝不能在 .eye 上挂 transform
          动画** —— 动画会整条覆盖 transform，居中的那一半位移直接丢失，
          眼球会当场往右下角窜半个身位。旋转一律挂在里面的 svg 上。
       ② 想裁住"只在眼睛里的东西"，靠的是 .eye 自己的 overflow:hidden + 圆角，
          别再套 clip-path：那一层如果和 border-radius 的椭圆不重合，
          边缘会露出一道极细的缝。 */
    #eyes {
      position: absolute; inset: 0;
      z-index: 4;
      opacity: 0;
      transition: opacity .14s ease;
      pointer-events: none;
    }
    body.dizzy #eyes { opacity: 1; }
    .eye {
      position: absolute;
      transform: translate(-50%, -50%);   /* 只负责居中；挂动画会把它冲掉，见上 */
      border-radius: 50%;
      background: #fbf7ef;
      box-shadow: inset 0 0 0 1px rgba(96, 64, 34, .3), 0 1px 2px rgba(0, 0, 0, .16);
      display: block;
      overflow: hidden;                   /* 螺旋出不了眼球 */
    }
    /* preserveAspectRatio=none：眼裂是横椭圆，螺旋跟着拉成横椭圆才铺满；
       等比缩放的话左右两端会各空出一条白边。 */
    .eye svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: dizzySpin .9s linear infinite; }

    /* ---- 抽烟：叼在嘴角的烟，会随呼吸变亮、随燃烧变短、会弹灰 ---- */
    #cig, #bottle, #smoke, #zzz, #burst {
      position: absolute; pointer-events: none; opacity: 0;
      transition: opacity .18s ease;
    }
    #cig {
      /* 几何全部来自 character.json 的 props.cig（换形象要重量，见档案里的 _propsComment）。
         这支烟是"横着斜出去"叼的，不是竖着往上 —— 这只猴子嘴到眼睛之间只有 8% 的
         竖直空间，烟一竖起来就会顶到眼睛，看着像烟烧进眼眶里。 */
      left: var(--cig-x, 54.5%); top: var(--cig-y, 62.2%);
      width: var(--cig-w, 2.8%);
      /* 30 秒里烧掉约 40%：--burn 由 JS 按"一口一口"推进，不是等速。
         烧短是从火头那头退的（支点在嘴里的屁股），所以长度递减、烟屁股不动。 */
      height: calc(var(--cig-len, 15%) - var(--burn, 0) * var(--cig-burn, 12%));
      transform: translate(-50%, -100%) rotate(var(--cig-deg, 72deg));
      transform-origin: 50% 100%;
      background: linear-gradient(#f8f5ec 0 64%, #e6dfd1 64% 88%, #cdc5b5 88% 100%);
      border-radius: 1.5px;
      z-index: 6;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .45);
      transition: height .8s linear, opacity .18s ease, transform .22s ease;
    }
    body.smoking #cig { opacity: 1; }
    /* 吸的那一下往嘴里缩一点 —— 烟不动的话就是一根白棍贴在脸上 */
    body.ember #cig {
      transform: translate(-50%, -100%) rotate(var(--cig-deg, 72deg)) translateY(7%);
    }

    /* 燃点：平时微暗地"呼吸"，吸气那一下骤亮 —— 真实烟头的明暗就是这个节奏 */
    #cig::before {
      content: ''; position: absolute; top: -5%; left: -36%;
      width: 172%; height: 22%; border-radius: 50%;
      background: radial-gradient(circle at 50% 55%, #ffe2b4 0 26%, #ff7c2c 58%, #a83a0c 100%);
      box-shadow: 0 0 4px rgba(255, 120, 40, .85);
      animation: emberPulse 7s ease-in-out infinite;
    }
    body.ember #cig::before { animation: emberSuck .95s cubic-bezier(.3, .7, .3, 1); }
    @keyframes emberPulse {
      0%, 100% { opacity: .48; filter: brightness(.85); }
      40%      { opacity: .78; filter: brightness(1.05); }
    }
    @keyframes emberSuck {
      0%   { opacity: .48; filter: brightness(.9); }
      32%  { opacity: 1; filter: brightness(2.1) saturate(1.4);
             box-shadow: 0 0 10px rgba(255, 145, 55, 1); }
      100% { opacity: .62; filter: brightness(1); }
    }

    /* 烟灰：长在燃烧端（烟的子元素，所以永远跟着烟走），越抽越长，弹一下就清空 */
    #cig i {
      position: absolute; top: 0; left: -4%; width: 108%;
      height: calc(var(--burn, 0) * 62%);
      background: linear-gradient(#9a9388, #6b6459);
      border-radius: 1.5px 1.5px 0 0;
      opacity: .8;
      transition: height .35s linear, opacity .3s ease, transform .3s ease;
    }
    body.ash-tap #cig i { opacity: 0; transform: translate(14%, 26%) scale(.8); }

    /* ---- 酒瓶 ----
       支点放在**瓶口**（嘴巴），所以"举瓶"是绕着嘴翻上去，而不是整只瓶子从别处
       平移过来 —— 这是它看起来不违和的关键。锚点 = e_sleepy 那张脸的嘴
       （喝酒全程只用这一张脸）。

       三条真实感规则，缺一条就会显得假：

       ① **液面永远水平**。原来酒液是瓶子的一部分，跟着瓶子一起转 —— 举到 -138°
          时酒全"浮"在翘起来的瓶底那头，瓶口这边反而是空的，看着像在喝空气。
          现在酒液按 -(瓶身倾角 + 身体仰头角) 反向转回来：真实液面只认重力，
          不认容器。
       ② **酒往低处流**。液面水平之后"灌满哪一半"是自动的：瓶子朝下时酒积在瓶口
          （同时瓶颈里也得有酒，否则等于瓶口在空气中倒酒），瓶身空的是翘起来那端。
          所以液面位置要跟着倾倒程度在两套刻度之间过渡（--pour，见下）。
       ③ **越喝越少、越喝越仰**。每吞一口液面掉一格，最后一口还要把瓶底竖得更高
          才够得着（body.sip-deep）。

       结构（顺序 = 绘制顺序）：
         .bt-body  瓶身玻璃，overflow:hidden 顺便当酒液的裁切框
           .bt-liq 酒液（反向旋转，液面就是它的上边缘）
         .bt-neck  瓶颈玻璃
           .bt-nliq 瓶颈里的酒 —— 瓶口是整瓶最低点，所以倾斜时那儿一定有酒
         .bt-sheen 玻璃高光，压在酒上面（否则酒看着像贴在瓶子外面的色块）
         .bt-cap   瓶口：暗色开口 + 一圈玻璃唇 */
    #bottle {
      left: 53%; top: 65%;
      width: 9%; height: 19%;
      transform-origin: 50% 0;
      /* 闲置时整瓶往下降一点，瓶口离开嘴唇（不然像长在下唇上）。
         --leanA 刻意**不在这里声明**：它得从 #lean 继承下来，
         这里一写就把祖先那层正在动画中的值盖掉了，液面立刻跟着头歪。 */
      --tilt: 12deg; --pour: 0; --dy: 5%;
      transform: translate(-50%, var(--dy)) rotate(var(--tilt));
      z-index: 6;
      /* 角度全部走**变量**过渡：瓶身和酒液读的是同一个 --tilt，
         所以"瓶身转到哪、液面就补偿到哪"在物理上不可能不同步。
         如果两边各写一条 transform transition，只要缓动曲线差一点，
         转的过程中液面就会歪着晃 —— 那比不补偿更假。 */
      transition: --tilt 1.15s cubic-bezier(.33, .86, .36, 1),
                  --pour 1.1s cubic-bezier(.33, .86, .36, 1),
                  --dy 1.15s cubic-bezier(.33, .86, .36, 1),
                  opacity .18s ease;
    }
    body.drinking #bottle { opacity: 1; }
    /* 仰灌：绕瓶口翻转 138°（比水平多转 48°），瓶底翘向右上方 */
    body.sip #bottle { --tilt: -138deg; --pour: 1; --dy: -1%; }
    /* 最后一口：见底了，得把瓶底竖得更高 */
    body.sip-deep #bottle { --tilt: -152deg; }

    .bt-body {
      position: absolute; left: 0; top: 24%; width: 100%; height: 76%;
      overflow: hidden;                 /* 酒液的裁切框：倒出来也不会流到瓶外 */
      border-radius: 3px 3px 7px 7px;
      background: linear-gradient(100deg,
        rgba(228, 240, 232, .62) 0 15%,
        rgba(196, 214, 202, .46) 15% 44%,
        rgba(150, 174, 158, .52) 44% 100%);
      box-shadow: inset -2px 0 3px rgba(255, 255, 255, .5),
                  inset 2px 0 3px rgba(64, 84, 72, .28),
                  0 1px 3px rgba(0, 0, 0, .42);
    }
    .bt-liq {
      position: absolute;
      /* 比瓶子大一圈：转起来之后仍要盖满瓶身（多出来的部分被 .bt-body 裁掉） */
      left: -160%; width: 420%; height: 500%;
      /* 液面位置：.bt-body 顶边为 0。
         直立时酒在**低处**（瓶底那半），倾到时在**瓶口**那半，
         两套刻度正好互补，所以按 --pour 线性过渡：
           --pour=0 → var(--sip)        （直着放：喝掉多少，空出上面多少）
           --pour=1 → 1 - var(--sip)    （倒过来：喝掉多少，瓶口这头就剩多少） */
      top: calc((var(--sip) + (1 - 2 * var(--sip)) * var(--pour)) * 100%);
      transform-origin: 50% 0;          /* 支点落在液面上：怎么晃，液面都过这一点 */
      /* 反着转回去的是**两层**的自转：瓶身倾角 --tilt + 仰头角 --leanA。
         两者都是注册过的 <angle>，都在各自的层上逐帧插值，然后被继承到这里，
         所以世界坐标里液面恒为 0° —— 瓶身和头转到哪，液面就补到哪。
         --slosh 是刻意的例外：咕咚的时候允许它歪一下再回正。 */
      transform: rotate(calc(-1 * var(--tilt) - var(--leanA, 0deg) + var(--slosh, 0deg)));
      background: linear-gradient(180deg,
        rgba(233, 172, 78, .96) 0,
        rgba(190, 121, 40, .97) 2.5%,
        rgba(126, 68, 18, .98) 9%,
        rgba(88, 44, 10, .98) 100%);
      border-top: 1px solid rgba(255, 228, 160, .8);   /* 液面那道亮边（弯月面） */
      box-shadow: 0 -1px 2px rgba(255, 212, 138, .5);
    }
    .bt-neck {
      position: absolute; left: 32%; top: 0; width: 36%; height: 26%;
      overflow: hidden;
      background: linear-gradient(100deg,
        rgba(234, 244, 236, .66) 0 32%,
        rgba(174, 194, 180, .58) 32% 100%);
      border-radius: 1px;
      box-shadow: inset -1px 0 1px rgba(255, 255, 255, .55),
                  inset 1px 0 1px rgba(64, 84, 72, .3);
    }
    /* 瓶颈里的酒：倾斜时从**瓶口**那头灌进来，再往瓶身里涨。
       clip-path 从"只剩顶上一条"过渡到"全满"，读起来就是酒先到嘴边、再退回瓶里。 */
    .bt-nliq {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #b8742a 0, #7d4513 100%);
      clip-path: inset(0 0 100% 0);
      transition: clip-path 1.15s cubic-bezier(.33, .86, .36, 1);
    }
    body.sip .bt-nliq { clip-path: inset(0 0 0 0); }

    .bt-sheen {
      position: absolute; left: 9%; top: 27%; width: 19%; height: 66%;
      border-radius: 1px;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, .68), rgba(255, 255, 255, .1) 52%, rgba(255, 255, 255, .46));
      opacity: .85;
    }
    .bt-cap {
      position: absolute; left: 30%; top: -2%; width: 40%; height: 5%;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 45%, #5e3410 0 42%, #d3e0d4 62% 100%);
    }

    /* 咕咚：酒面跟着晃一下再停住（甩一下衰减振荡）。
       只用角度不用位移 —— 角度是尺度无关的，窗口放大也照样对。 */
    @keyframes wineSlosh {
      0%   { --slosh: 0deg; }
      16%  { --slosh: 7deg; }
      40%  { --slosh: -4.6deg; }
      62%  { --slosh: 2.4deg; }
      82%  { --slosh: -1deg; }
      100% { --slosh: 0deg; }
    }
    body.gulp .bt-liq { animation: wineSlosh .68s cubic-bezier(.3, .7, .4, 1); }

    /* 烟圈：只在"吐"的那一拍喷出来，先急后缓（原来匀速上升是假感主因） */
    /* 烟柱起点跟着火头走（--cig-tip-* 由 JS 按当前燃烧长度算），
       并且往外斜着飘 —— 原来是竖着从脸中间升上去，正好糊住右眼。 */
    #smoke {
      left: var(--cig-tip-x, 71%); top: var(--cig-tip-y, 58%);
      width: 0; height: 0; z-index: 7;
    }
    body.smoking #smoke { opacity: 1; }
    #smoke i {
      position: absolute; left: 0; top: 0;
      /* 用 vw 而不是父元素百分比：父元素是个零尺寸的锚点，百分比算不出来。
         vw 在这里就等于窗口宽度，换缩放也会跟着变。 */
      width: 13vw; aspect-ratio: 1 / 1;
      margin-left: -6.5vw; margin-top: -6.5vw;   /* 以锚点为中心；不用 translate 居中，
                                                    否则会被关键帧里的 transform 顶掉 */
      border-radius: 50%;
      /* 灰蓝调而不是纯白：浅色桌面上纯白等于看不见 */
      background: radial-gradient(circle at 40% 36%,
        rgba(255, 255, 255, .97) 0 22%,
        rgba(206, 213, 226, .62) 56%,
        rgba(188, 196, 212, .12) 100%);
      filter: blur(1.1px) drop-shadow(0 1px 1px rgba(70, 80, 100, .22));
      opacity: 0;
      will-change: transform, opacity;
    }
    body.puffing #smoke i { animation: puffUp 2.3s cubic-bezier(.14, .7, .28, 1) forwards; }
    body.puffing #smoke i:nth-child(2) { animation-delay: .14s; }
    body.puffing #smoke i:nth-child(3) { animation-delay: .3s; }
    /* 一口涌出 → 往右上方飘散，绕开眼睛那一带 */
    @keyframes puffUp {
      0%   { transform: translate(0, 0) scale(.3);          opacity: 0; }
      8%   { transform: translate(18%, -22%) scale(.8);     opacity: .5; }
      45%  { transform: translate(110%, -80%) scale(1.5);   opacity: .2; }
      100% { transform: translate(230%, -170%) scale(2.1);  opacity: 0; }
    }

    /* ---- 睡着：Z z z ---- */
    #zzz { left: 62%; top: 22%; width: 30%; height: 34%; z-index: 5; }
    body.asleep #zzz { opacity: 1; }
    #zzz b {
      position: absolute; left: 0; bottom: 0;
      font: 700 15px/1 "Microsoft YaHei", sans-serif;
      color: #e4efff; text-shadow: 0 1px 4px rgba(0, 0, 0, .65);
      animation: zFloat 3s linear infinite;
    }
    #zzz b:nth-child(2) { left: 32%; animation-delay: 1s; font-size: 12px; }
    #zzz b:nth-child(3) { left: 60%; animation-delay: 2s; font-size: 9px; }
    @keyframes zFloat {
      0%   { transform: translateY(0) scale(.7); opacity: 0; }
      25%  { opacity: .95; }
      100% { transform: translateY(-200%) translateX(40%) scale(1.2); opacity: 0; }
    }

    /* ---- 忧郁：垮肩下沉（缓慢，像叹气）+ 褪色 ---- */
    @keyframes poseSlump {
      0%, 100% { transform: translateY(.4%) scaleY(.992) rotate(0deg); }
      50%      { transform: translateY(1.2%) scaleY(.972) rotate(-.7deg); }
    }
    body.blue #pose { animation: poseSlump 7s ease-in-out infinite; }

    /* ---- 醉拳式晃悠：不是匀速左右摆，而是"歪过去—强撑—慢慢回—再歪" ---- */
    /* 关键帧间隔刻意不相等（10%/19%/34%/52%/58%），才有立足不稳的随机感 */
    @keyframes poseSway {
      0%   { transform: rotate(-2deg)  translateX(-1%); }
      10%  { transform: rotate(6deg)   translateX(2.6%) translateY(-1%); }
      19%  { transform: rotate(5.2deg) translateX(2.2%); }
      34%  { transform: rotate(-.6deg) translateX(0) translateY(.6%); }
      52%  { transform: rotate(-7deg)  translateX(-3%) translateY(.4%); }
      58%  { transform: rotate(-6deg)  translateX(-2.6%) translateY(1.2%); }
      72%  { transform: rotate(1.2deg) translateX(.6%) translateY(-.4%); }
      86%  { transform: rotate(2.4deg) translateX(1%); }
      100% { transform: rotate(-2deg)  translateX(-1%); }
    }
    body.drunk #pose { animation: poseSway 4.8s cubic-bezier(.42, 0, .58, 1) infinite; }
    body.drunk2 #pose { animation-duration: 3.2s; }   /* 越喝越晃 */

    /* ---- 困：一点点低头 → 猛地惊醒 → 再慢慢垂下去 ---- */
    @keyframes poseNod {
      0%, 26% { transform: rotate(0deg) translateY(0); }
      52%     { transform: rotate(3.4deg) translateY(1.5%) scaleY(.988); }
      60%     { transform: rotate(3.8deg) translateY(2%) scaleY(.982); }
      70%     { transform: rotate(-.6deg) translateY(-.3%); }
      100%    { transform: rotate(0deg) translateY(0); }
    }
    body.nod #pose { animation: poseNod 5.8s ease-in-out infinite; }

    body.blue #breath { filter: grayscale(.75) brightness(.86) drop-shadow(0 4px 10px rgba(0, 0, 0, .42)); }

    /* ---- 满血复活：一圈光 ---- */
    #burst {
      left: 50%; top: 50%; width: 74%; aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(255, 226, 120, .95);
      box-shadow: 0 0 12px rgba(255, 214, 90, .8), inset 0 0 12px rgba(255, 214, 90, .6);
      z-index: 6;
    }
    body.revive #burst { opacity: 1; animation: burstRing 1.3s ease-out; }
    @keyframes burstRing {
      0%   { transform: translate(-50%, -50%) scale(.25); opacity: 1; }
      70%  { transform: translate(-50%, -50%) scale(1.1);  opacity: .55; }
      100% { transform: translate(-50%, -50%) scale(1.35); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="tilt"><div id="gait"><div id="pose"><div id="lean"><div id="breath">
      <div id="head"><div id="headSpin"><img alt="" /></div></div>
      <div id="eyes"></div>
      <div id="cig"><i></i></div>
      <div id="bottle">
        <span class="bt-body"><span class="bt-liq"></span></span>
        <span class="bt-neck"><span class="bt-nliq"></span></span>
        <span class="bt-sheen"></span>
        <span class="bt-cap"></span>
      </div>
      <div id="smoke"><i></i><i></i><i></i></div>
      <div id="zzz"><b>Z</b><b>Z</b><b>Z</b></div>
      <div id="burst"></div>
    </div></div></div></div></div>
  </div>
  <script src="anim.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
