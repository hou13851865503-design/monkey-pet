<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>小猴桌宠</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage {
      position: absolute; inset: 0;
      cursor: grab;
      touch-action: none;   /* 保证指针事件不被浏览器手势打断 */
    }
    #stage:active { cursor: grabbing; }

    /* 伪 3D 透视倾斜层（JS 每帧更新 transform） */
    #tilt { position: absolute; inset: 0; will-change: transform; }

    /* 步态/挤压层：走路起伏、落地压扁、拖拽悬垂都由 JS 每帧写 transform。
       支点固定在脚底（--foot 由角色档案给），所以旋转和挤压都是"绕脚"发生的，
       看起来像踩在地上，而不是整个人在画布中心扭。 */
    #gait {
      position: absolute; inset: 0;
      transform-origin: 50% var(--foot, 99.5%);
      will-change: transform;
    }

    /* 姿态层：醉拳摇摆 / 瞌睡点头 / 忧郁垮肩。
       单独一层，避免和 #tilt(鼠标透视)、#breath(呼吸) 抢同一个 transform */
    #pose { position: absolute; inset: 0; transform-origin: 50% 94%; will-change: transform; }

    /* 前倾/仰头层：仰头灌酒、吐烟仰头、呼气下沉。用 transition 而非 animation，
       所以"举瓶—仰头—放下"是一条连续的缓动曲线，不是硬切 */
    #lean {
      position: absolute; inset: 0;
      transform-origin: 50% 96%;
      transition: transform .85s cubic-bezier(.3, .84, .35, 1);
    }
    body.sip      #lean { transform: rotate(-6.5deg) translateY(1.4%); }   /* 仰头灌 */
    body.tiltback #lean { transform: rotate(-3.2deg) translateY(.5%); }    /* 吐烟轻仰 */
    body.slump    #lean { transform: translateY(1.7%) scaleY(.98); }       /* 呼气下沉 */

    /* 呼吸动画层 */
    #breath {
      position: absolute; inset: 0;
      transform-origin: center bottom;
      animation: breathe 3.4s ease-in-out infinite;
      /* 描边 + 投影：压在复杂界面上也能看清轮廓 */
      filter: drop-shadow(0 0 1.2px rgba(0, 0, 0, .55)) drop-shadow(0 4px 10px rgba(0, 0, 0, .32));
    }
    /* 拖拽时加强轮廓，明确"我正被拿起" */
    body.dragging #breath {
      filter: drop-shadow(0 0 2px rgba(0, 0, 0, .9)) drop-shadow(0 10px 20px rgba(0, 0, 0, .5));
    }
    @keyframes breathe {      0%, 100% { transform: scaleY(1) translateY(0); }
      50%      { transform: scaleY(0.97) translateY(2px); }
    }

    /* 所有帧叠在同一位置，靠 opacity 交叉淡入 => 动作连贯 */
    .f {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity .24s ease, transform .2s ease;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .f.active { opacity: 1; }

    /* 看向左侧：把右向帧水平镜像（素材没有左向帧） */
    body.faceLeft .f { transform: scaleX(-1); }

    /* 点击穿透模式提示 */
    body.clickthrough #stage { opacity: 0.8; cursor: default; }

    /* ---- 眩晕：头顶转圈 + 身体摇晃 ---- */
    #swirl {
      position: absolute;
      left: 50%; top: 1%;
      width: 44%; aspect-ratio: 1 / 1;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity .16s ease;
      pointer-events: none;
      z-index: 3;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .35));
    }
    #swirl svg { width: 100%; height: 100%; animation: dizzySpin 1.05s linear infinite; }
    body.dizzy #swirl { opacity: 1; }
    @keyframes dizzySpin { to { transform: rotate(360deg); } }

    @keyframes dizzyWobble {
      0%, 100% { transform: rotate(-5deg) translateX(-2%); }
      50%      { transform: rotate(5deg)  translateX(2%); }
    }
    body.dizzy #breath { animation: dizzyWobble .42s ease-in-out infinite; }

    /* 空闲时偶尔小跳一下 */
    @keyframes hopUp {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      22%      { transform: translateY(-13%) scale(.97, 1.04); }
      55%      { transform: translateY(0) scale(1.03, .97); }
      72%      { transform: translateY(-5%) scale(1, 1); }
    }
    body.hop #breath { animation: hopUp .62s ease-out; }

    /* ---- 眩晕眼：盖住原瞳孔的卡通眼球 + 旋转螺旋 ----
       位置和大小不写死在这里，改由 character.json 的 eyes 生成（换形象要重量）。
       用椭圆而不是正圆：眼裂本来就比它高更宽，正圆总会有一头露出来。 */
    #eyes {
      position: absolute; inset: 0;
      z-index: 4;
      opacity: 0;
      transition: opacity .14s ease;
      pointer-events: none;
    }
    body.dizzy #eyes { opacity: 1; }
    .eye {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #fbf7ef;
      box-shadow: inset 0 0 0 1px rgba(96, 64, 34, .3), 0 1px 2px rgba(0, 0, 0, .16);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .eye svg { width: 86%; height: 86%; animation: dizzySpin .9s linear infinite; }

    /* ---- 抽烟：叼在嘴角的烟，会随呼吸变亮、随燃烧变短、会弹灰 ---- */
    #cig, #bottle, #smoke, #zzz, #burst {
      position: absolute; pointer-events: none; opacity: 0;
      transition: opacity .18s ease;
    }
    #cig {
      /* 几何全部来自 character.json 的 props.cig（换形象要重量，见档案里的 _propsComment）。
         这支烟是"横着斜出去"叼的，不是竖着往上 —— 这只猴子嘴到眼睛之间只有 8% 的
         竖直空间，烟一竖起来就会顶到眼睛，看着像烟烧进眼眶里。 */
      left: var(--cig-x, 54.5%); top: var(--cig-y, 62.2%);
      width: var(--cig-w, 2.8%);
      /* 30 秒里烧掉约 40%：--burn 由 JS 按"一口一口"推进，不是等速。
         烧短是从火头那头退的（支点在嘴里的屁股），所以长度递减、烟屁股不动。 */
      height: calc(var(--cig-len, 15%) - var(--burn, 0) * var(--cig-burn, 12%));
      transform: translate(-50%, -100%) rotate(var(--cig-deg, 72deg));
      transform-origin: 50% 100%;
      background: linear-gradient(#f8f5ec 0 64%, #e6dfd1 64% 88%, #cdc5b5 88% 100%);
      border-radius: 1.5px;
      z-index: 6;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .45);
      transition: height .8s linear, opacity .18s ease, transform .22s ease;
    }
    body.smoking #cig { opacity: 1; }
    /* 吸的那一下往嘴里缩一点 —— 烟不动的话就是一根白棍贴在脸上 */
    body.ember #cig {
      transform: translate(-50%, -100%) rotate(var(--cig-deg, 72deg)) translateY(7%);
    }

    /* 燃点：平时微暗地"呼吸"，吸气那一下骤亮 —— 真实烟头的明暗就是这个节奏 */
    #cig::before {
      content: ''; position: absolute; top: -5%; left: -36%;
      width: 172%; height: 22%; border-radius: 50%;
      background: radial-gradient(circle at 50% 55%, #ffe2b4 0 26%, #ff7c2c 58%, #a83a0c 100%);
      box-shadow: 0 0 4px rgba(255, 120, 40, .85);
      animation: emberPulse 7s ease-in-out infinite;
    }
    body.ember #cig::before { animation: emberSuck .95s cubic-bezier(.3, .7, .3, 1); }
    @keyframes emberPulse {
      0%, 100% { opacity: .48; filter: brightness(.85); }
      40%      { opacity: .78; filter: brightness(1.05); }
    }
    @keyframes emberSuck {
      0%   { opacity: .48; filter: brightness(.9); }
      32%  { opacity: 1; filter: brightness(2.1) saturate(1.4);
             box-shadow: 0 0 10px rgba(255, 145, 55, 1); }
      100% { opacity: .62; filter: brightness(1); }
    }

    /* 烟灰：长在燃烧端（烟的子元素，所以永远跟着烟走），越抽越长，弹一下就清空 */
    #cig i {
      position: absolute; top: 0; left: -4%; width: 108%;
      height: calc(var(--burn, 0) * 62%);
      background: linear-gradient(#9a9388, #6b6459);
      border-radius: 1.5px 1.5px 0 0;
      opacity: .8;
      transition: height .35s linear, opacity .3s ease, transform .3s ease;
    }
    body.ash-tap #cig i { opacity: 0; transform: translate(14%, 26%) scale(.8); }

    /* 酒瓶：支点放在**瓶口**（嘴巴），所以"举瓶"是绕着嘴翻上去，
       而不是整只瓶子从别处平移过来 —— 这是它看起来不违和的关键。
       锚点 = e_sleepy 那张脸的嘴（喝酒全程只用这一张脸）。
       结构：::after=瓶颈(0~24%)，::before=瓶身(24~100%)，i=酒液 */
    #bottle {
      left: 53%; top: 65%;
      width: 9%; height: 19%;
      transform-origin: 50% 0;
      /* 闲置时整瓶往下降一点，瓶口离开嘴唇（不然像长在下唇上） */
      transform: translate(-50%, 5%) rotate(12deg);
      z-index: 6;
      transition: transform 1.15s cubic-bezier(.33, .86, .36, 1), opacity .18s ease;
    }
    body.drinking #bottle { opacity: 1; }
    /* 仰灌：绕瓶口翻转 138°，瓶底翘向右上方（液体正好压到瓶口） */
    body.sip #bottle { transform: translate(-50%, -1%) rotate(-138deg); }
    #bottle::before {
      content: ''; position: absolute; top: 24%; left: 0;
      width: 100%; height: 76%;
      background: linear-gradient(100deg, rgba(216, 228, 216, .95) 0 20%, rgba(166, 184, 166, .92) 20% 100%);
      border-radius: 2px 2px 5px 5px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .42), inset -1px 0 2px rgba(255, 255, 255, .35);
    }
    #bottle::after {
      content: ''; position: absolute; top: 0; left: 32%;
      width: 36%; height: 26%;
      background: linear-gradient(100deg, #d7e3d7 0 30%, #aebfae 30% 100%);
      border-radius: 1px;
      box-shadow: inset -1px 0 1px rgba(255, 255, 255, .4);
    }
    #bottle i {
      position: absolute; left: 8%; bottom: 3%; width: 84%;
      height: calc((1 - var(--sip, 0)) * 72%);
      border-radius: 0 0 4px 4px;
      background: linear-gradient(#c08a33, #8a5a1c);
      transition: height 1.1s ease;
    }

    /* 烟圈：只在"吐"的那一拍喷出来，先急后缓（原来匀速上升是假感主因） */
    /* 烟柱起点跟着火头走（--cig-tip-* 由 JS 按当前燃烧长度算），
       并且往外斜着飘 —— 原来是竖着从脸中间升上去，正好糊住右眼。 */
    #smoke {
      left: var(--cig-tip-x, 71%); top: var(--cig-tip-y, 58%);
      width: 0; height: 0; z-index: 7;
    }
    body.smoking #smoke { opacity: 1; }
    #smoke i {
      position: absolute; left: 0; top: 0;
      /* 用 vw 而不是父元素百分比：父元素是个零尺寸的锚点，百分比算不出来。
         vw 在这里就等于窗口宽度，换缩放也会跟着变。 */
      width: 13vw; aspect-ratio: 1 / 1;
      margin-left: -6.5vw; margin-top: -6.5vw;   /* 以锚点为中心；不用 translate 居中，
                                                    否则会被关键帧里的 transform 顶掉 */
      border-radius: 50%;
      /* 灰蓝调而不是纯白：浅色桌面上纯白等于看不见 */
      background: radial-gradient(circle at 40% 36%,
        rgba(255, 255, 255, .97) 0 22%,
        rgba(206, 213, 226, .62) 56%,
        rgba(188, 196, 212, .12) 100%);
      filter: blur(1.1px) drop-shadow(0 1px 1px rgba(70, 80, 100, .22));
      opacity: 0;
      will-change: transform, opacity;
    }
    body.puffing #smoke i { animation: puffUp 2.3s cubic-bezier(.14, .7, .28, 1) forwards; }
    body.puffing #smoke i:nth-child(2) { animation-delay: .14s; }
    body.puffing #smoke i:nth-child(3) { animation-delay: .3s; }
    /* 一口涌出 → 往右上方飘散，绕开眼睛那一带 */
    @keyframes puffUp {
      0%   { transform: translate(0, 0) scale(.3);          opacity: 0; }
      8%   { transform: translate(18%, -22%) scale(.8);     opacity: .5; }
      45%  { transform: translate(110%, -80%) scale(1.5);   opacity: .2; }
      100% { transform: translate(230%, -170%) scale(2.1);  opacity: 0; }
    }

    /* ---- 睡着：Z z z ---- */
    #zzz { left: 62%; top: 22%; width: 30%; height: 34%; z-index: 5; }
    body.asleep #zzz { opacity: 1; }
    #zzz b {
      position: absolute; left: 0; bottom: 0;
      font: 700 15px/1 "Microsoft YaHei", sans-serif;
      color: #e4efff; text-shadow: 0 1px 4px rgba(0, 0, 0, .65);
      animation: zFloat 3s linear infinite;
    }
    #zzz b:nth-child(2) { left: 32%; animation-delay: 1s; font-size: 12px; }
    #zzz b:nth-child(3) { left: 60%; animation-delay: 2s; font-size: 9px; }
    @keyframes zFloat {
      0%   { transform: translateY(0) scale(.7); opacity: 0; }
      25%  { opacity: .95; }
      100% { transform: translateY(-200%) translateX(40%) scale(1.2); opacity: 0; }
    }

    /* ---- 忧郁：垮肩下沉（缓慢，像叹气）+ 褪色 ---- */
    @keyframes poseSlump {
      0%, 100% { transform: translateY(.4%) scaleY(.992) rotate(0deg); }
      50%      { transform: translateY(1.2%) scaleY(.972) rotate(-.7deg); }
    }
    body.blue #pose { animation: poseSlump 7s ease-in-out infinite; }

    /* ---- 醉拳式晃悠：不是匀速左右摆，而是"歪过去—强撑—慢慢回—再歪" ---- */
    /* 关键帧间隔刻意不相等（10%/19%/34%/52%/58%），才有立足不稳的随机感 */
    @keyframes poseSway {
      0%   { transform: rotate(-2deg)  translateX(-1%); }
      10%  { transform: rotate(6deg)   translateX(2.6%) translateY(-1%); }
      19%  { transform: rotate(5.2deg) translateX(2.2%); }
      34%  { transform: rotate(-.6deg) translateX(0) translateY(.6%); }
      52%  { transform: rotate(-7deg)  translateX(-3%) translateY(.4%); }
      58%  { transform: rotate(-6deg)  translateX(-2.6%) translateY(1.2%); }
      72%  { transform: rotate(1.2deg) translateX(.6%) translateY(-.4%); }
      86%  { transform: rotate(2.4deg) translateX(1%); }
      100% { transform: rotate(-2deg)  translateX(-1%); }
    }
    body.drunk #pose { animation: poseSway 4.8s cubic-bezier(.42, 0, .58, 1) infinite; }
    body.drunk2 #pose { animation-duration: 3.2s; }   /* 越喝越晃 */

    /* ---- 困：一点点低头 → 猛地惊醒 → 再慢慢垂下去 ---- */
    @keyframes poseNod {
      0%, 26% { transform: rotate(0deg) translateY(0); }
      52%     { transform: rotate(3.4deg) translateY(1.5%) scaleY(.988); }
      60%     { transform: rotate(3.8deg) translateY(2%) scaleY(.982); }
      70%     { transform: rotate(-.6deg) translateY(-.3%); }
      100%    { transform: rotate(0deg) translateY(0); }
    }
    body.nod #pose { animation: poseNod 5.8s ease-in-out infinite; }

    body.blue #breath { filter: grayscale(.75) brightness(.86) drop-shadow(0 4px 10px rgba(0, 0, 0, .42)); }

    /* ---- 满血复活：一圈光 ---- */
    #burst {
      left: 50%; top: 50%; width: 74%; aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(255, 226, 120, .95);
      box-shadow: 0 0 12px rgba(255, 214, 90, .8), inset 0 0 12px rgba(255, 214, 90, .6);
      z-index: 6;
    }
    body.revive #burst { opacity: 1; animation: burstRing 1.3s ease-out; }
    @keyframes burstRing {
      0%   { transform: translate(-50%, -50%) scale(.25); opacity: 1; }
      70%  { transform: translate(-50%, -50%) scale(1.1);  opacity: .55; }
      100% { transform: translate(-50%, -50%) scale(1.35); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="swirl">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 9a23 23 0 1 1 -16 40" fill="none" stroke="#ffd54a" stroke-width="4.5" stroke-linecap="round" opacity=".95"/>
        <path d="M32 20a12 12 0 1 0 9 21" fill="none" stroke="#ffd54a" stroke-width="3.5" stroke-linecap="round" opacity=".75"/>
        <circle cx="32" cy="32" r="2.6" fill="#ffd54a"/>
      </svg>
    </div>
    <div id="tilt"><div id="gait"><div id="pose"><div id="lean"><div id="breath">
      <div id="eyes"></div>
      <div id="cig"><i></i></div>
      <div id="bottle"><i></i></div>
      <div id="smoke"><i></i><i></i><i></i></div>
      <div id="zzz"><b>Z</b><b>Z</b><b>Z</b></div>
      <div id="burst"></div>
    </div></div></div></div></div>
  </div>
  <script src="anim.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
