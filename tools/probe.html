<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; background: #fff; font: 12px/1.3 "Microsoft YaHei", sans-serif; }
    .row { display: flex; }
    .box { position: relative; width: 300px; height: 340px; margin: 26px 10px 10px; }
    .box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .grid { position: absolute; inset: 0; }
    .grid i { position: absolute; background: rgba(0, 120, 255, .35); }
    .grid i.h { left: 0; right: 0; height: 1px; }
    .grid i.v { top: 0; bottom: 0; width: 1px; }
    .grid b { position: absolute; font-size: 9px; color: #06c; transform: translate(-50%, -120%); }
    .grid b.y { left: 2px; transform: translate(0, -50%); }
    .cap { position: absolute; top: -20px; left: 0; font-weight: 700; color: #333; }
  </style>
</head>
<body>
  <div class="row" id="row"></div>
  <script>
    const files = ['01.png', 'emotion_sad.png', 'emotion_sleepy.png'];
    const row = document.getElementById('row');
    files.forEach((f) => {
      const box = document.createElement('div');
      box.className = 'box';
      box.innerHTML = '<span class="cap">' + f + '</span><img src="../assets/' + f + '"><div class="grid"></div>';
      const g = box.querySelector('.grid');
      for (let p = 5; p < 100; p += 5) {
        const h = document.createElement('i'); h.className = 'h'; h.style.top = p + '%'; g.appendChild(h);
        const v = document.createElement('i'); v.className = 'v'; v.style.left = p + '%'; g.appendChild(v);
        if (p % 10 === 0) {
          const by = document.createElement('b'); by.className = 'y'; by.textContent = p; by.style.top = p + '%'; g.appendChild(by);
          const bx = document.createElement('b'); bx.textContent = p; bx.style.left = p + '%'; bx.style.top = '0'; g.appendChild(bx);
        }
      }
      row.appendChild(box);
    });
  </script>
</body>
</html>
