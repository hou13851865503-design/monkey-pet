<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AI 设置</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: #f6f7fa; color: #20242c;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .sub { font-size: 12px; color: #7b8494; margin-bottom: 14px; line-height: 1.5; }
    .card { background: #fff; border: 1px solid #e6e9f0; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card-h { font-size: 13px; font-weight: 700; color: #33405a; margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: #5b667a; margin: 10px 0 5px; }
    label:first-child { margin-top: 0; }
    input[type=text], input[type=password], input[type=time], input[type=number] {
      width: 100%; padding: 9px 11px; border: 1px solid #dfe3ea; border-radius: 9px;
      font-size: 13px; outline: none; background: #fff;
    }
    input:focus { border-color: #5b9bff; box-shadow: 0 0 0 3px rgba(91,155,255,.15); }
    .row2 { display: flex; gap: 10px; }
    .row2 > div { flex: 1; }
    .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #33405a; margin: 10px 0; }
    .check input { width: 16px; height: 16px; }
    .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .btn { padding: 9px 16px; border: 0; border-radius: 9px; font-size: 13px; cursor: pointer; }
    .btn.primary { background: #3b82f6; color: #fff; }
    .btn.ghost { background: #e8edf6; color: #33405a; }
    #status { font-size: 12px; color: #7b8494; margin-top: 10px; min-height: 16px; word-break: break-word; }
    .hint { font-size: 11px; color: #9aa2b1; margin-top: 6px; line-height: 1.5; }
    code { background: #eef2f8; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>AI 设置</h1>
  <div class="sub">用于「AI 对话」「名片识别」「PDF 论文解析」。接 <b>WorkBuddy API</b>（OpenAI 兼容协议），没配也能用，相关功能会自动降级。</div>

  <div class="card">
    <div class="card-h">WorkBuddy API</div>
    <label>Base URL（填到 <code>/v1</code> 为止，程序自己补 <code>/chat/completions</code>）</label>
    <input id="baseUrl" type="text" placeholder="https://你的-workbuddy-接口地址/v1" />
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="填 WorkBuddy 后台给你的 Key" />
    <label>模型名 <a id="unlock" href="javascript:void(0)" style="font-size:11px;color:#3b82f6;text-decoration:none">改用其他模型</a></label>
    <input id="model" type="text" value="DeepSeek-V4.1-Flash" readonly style="background:#f4f6fa;color:#5b6478" />
    <div class="hint">默认固定用 <code>DeepSeek-V4.1-Flash</code>。地址末尾多一个 <code>/</code> 会拼出 <code>//chat/completions</code>，程序已经帮你兜住了；已经写到 <code>/chat/completions</code> 的也不会被重复拼。</div>
    <div class="row2" style="margin-top:10px">
      <div>
        <label>超时（毫秒）</label>
        <input id="timeoutMs" type="number" min="5000" max="180000" step="1000" value="25000" />
      </div>
      <div>
        <label>失败重试次数</label>
        <input id="maxRetries" type="number" min="0" max="4" step="1" value="2" />
      </div>
    </div>
    <div id="status"></div>
    <div style="margin-top:10px"><button id="testBtn" class="btn ghost">测试连接</button></div>
  </div>

  <div class="card">
    <div class="card-h">早报 & 语音</div>
    <label>城市（用于天气）</label>
    <input id="city" type="text" placeholder="南京" />
    <div class="row2">
      <div>
        <label>每日早报时间</label>
        <input id="reportTime" type="time" value="08:30" />
      </div>
    </div>
    <div class="check"><input id="morningReport" type="checkbox" /><span>开启每日早报（天气 + 一条热点）</span></div>
    <div class="check"><input id="tts" type="checkbox" /><span>开启语音朗读（用系统 TTS）</span></div>
  </div>

  <div class="foot">
    <span class="hint">密钥只保存在本机 settings.json</span>
    <button id="saveBtn" class="btn primary">保存</button>
  </div>

  <script>
    const api = window.pet || {};
    function $(id) { return document.getElementById(id); }

    async function load() {
      try {
        if (!api.getAiSettings) return;
        const d = (await api.getAiSettings()) || {};
        const ai = d.ai || {};
        $('baseUrl').value = ai.baseUrl || '';
        $('apiKey').value = ai.apiKey || '';
        $('model').value = ai.model || 'DeepSeek-V4.1-Flash';
        $('timeoutMs').value = ai.timeoutMs || 25000;
        $('maxRetries').value = Number.isFinite(Number(ai.maxRetries)) ? ai.maxRetries : 2;
        $('city').value = d.city || '南京';
        $('reportTime').value = d.reportTime || '08:30';
        $('morningReport').checked = !!d.morningReport;
        $('tts').checked = !!d.tts;
        // 熔断中还剩多少秒，直接告诉用户，省得以为坏了
        const st = (d.status || {});
        if (st.breakerLeftMs > 0) $('status').textContent = '接口连续失败，冷却中（约 ' + Math.ceil(st.breakerLeftMs / 1000) + ' 秒）';
      } catch (_) {}
    }

    $('unlock').addEventListener('click', () => {
      const m = $('model');
      m.readOnly = false;
      m.style.background = '';
      m.style.color = '';
      m.focus();
      $('unlock').style.display = 'none';
    });

    function collect() {
      return {
        ai: {
          baseUrl: $('baseUrl').value.trim(),
          apiKey: $('apiKey').value.trim(),
          model: $('model').value.trim() || 'DeepSeek-V4.1-Flash',
          timeoutMs: Number($('timeoutMs').value) || 25000,
          maxRetries: Number($('maxRetries').value) || 0,
        },
        city: $('city').value.trim(),
        reportTime: $('reportTime').value || '08:30',
        morningReport: $('morningReport').checked,
        tts: $('tts').checked,
      };
    }

    $('saveBtn').addEventListener('click', async () => {
      try {
        if (api.saveAiSettings) await api.saveAiSettings(collect());
        $('status').textContent = '已保存 ✓';
        setTimeout(() => { $('status').textContent = ''; }, 1500);
      } catch (e) { $('status').textContent = '保存失败'; }
    });

    $('testBtn').addEventListener('click', async () => {
      const st = $('status');
      st.textContent = '测试中…';
      try {
        // 用"还没保存的"配置去测，改了就地验证，不用先存
        const r = api.wbTest
          ? await api.wbTest(collect())
          : await api.chat([{ role: 'user', content: '只回复两个字：收到' }]);
        if (r && r.ok) {
          st.textContent = '连接成功 ✓ ' + (r.model || '') + (r.ms ? '（' + r.ms + 'ms）' : '');
          st.style.color = '#1a7f4b';
        } else {
          // 失败时把错误码也给出来，方便对着排查（auth / model-not-found / network …）
          st.textContent = '连接失败：' + ((r && (r.hint || r.error)) || '未知错误') +
            (r && r.code ? '  [' + r.code + ']' : '');
          st.style.color = '#c0392b';
        }
      } catch (e) { st.textContent = '测试失败：' + (e.message || e); st.style.color = '#c0392b'; }
    });

    load();
  </script>
</body>
</html>
