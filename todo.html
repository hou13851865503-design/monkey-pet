<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>今日待办</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #f6f7fa; --card: #fff; --line: #e6e9f0; --ink: #20242c;
      --dim: #7b8494; --faint: #9aa2b1; --blue: #3b82f6; --blue-soft: #e8edf6;
      --red: #e5534b; --amber: #c98118; --green: #2f9e63;
    }
    html, body { height: 100%; }
    body {
      margin: 0; padding: 14px 14px 0;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg); color: var(--ink);
      display: flex; flex-direction: column; height: 100vh;
    }
    /* ---------- 头部 ---------- */
    header { flex: 0 0 auto; }
    .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    h1 { font-size: 16px; margin: 0; }
    .date { font-size: 11px; color: var(--faint); }
    .bar { height: 5px; border-radius: 3px; background: #e4e8f0; margin: 9px 0 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #57b894, #3b82f6); transition: width .25s ease; }
    .stat { font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; }
    /* ---------- 添加 ---------- */
    .add { flex: 0 0 auto; margin: 12px 0 8px; }
    .add .line { display: flex; gap: 8px; }
    .add input[type=text] {
      flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid #dfe3ea; border-radius: 10px;
      font-size: 13px; outline: none; background: #fff; font-family: inherit;
    }
    .add input[type=text]:focus { border-color: #5b9bff; box-shadow: 0 0 0 3px rgba(91,155,255,.15); }
    .opts { display: flex; gap: 6px; align-items: center; margin-top: 7px; }
    .seg { display: flex; flex: 0 0 auto; border: 1px solid #dfe3ea; border-radius: 9px; overflow: hidden; background: #fff; }
    .seg button {
      border: 0; background: transparent; font-size: 12px; padding: 6px 8px;
      color: var(--dim); cursor: pointer; font-family: inherit;
    }
    .seg button.on { background: var(--blue-soft); color: #2c4a80; font-weight: 600; }
    .opts input[type=number], .opts input[type=date] {
      border: 1px solid #dfe3ea; border-radius: 9px; padding: 6px 6px;
      font-size: 12px; background: #fff; color: var(--ink); outline: none; font-family: inherit;
    }
    .opts input[type=number] { width: 52px; text-align: center; }
    .opts input[type=date] { width: 110px; margin-left: auto; }
    .opts .lbl { font-size: 11px; color: var(--faint); }
    #addBtn {
      flex: 0 0 auto; border: 0; border-radius: 10px; background: var(--blue); color: #fff;
      font-size: 13px; padding: 0 15px; cursor: pointer;
    }
    #addBtn:active { transform: translateY(1px); }
    /* ---------- 列表 ---------- */
    main { flex: 1 1 auto; overflow-y: auto; padding-bottom: 8px; }
    .grp { margin-top: 10px; }
    .grp > .gh { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--faint); margin: 0 2px 6px; }
    .grp > .gh b { font-weight: 600; color: var(--dim); }
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    li.item {
      display: flex; align-items: flex-start; gap: 9px;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 9px 10px;
    }
    li.item .cb {
      flex: 0 0 auto; width: 16px; height: 16px; margin-top: 1px;
      border: 1.5px solid #c3cad6; border-radius: 5px; background: #fff;
      cursor: pointer; position: relative;
    }
    li.item.done .cb { background: var(--green); border-color: var(--green); }
    li.item.done .cb::after {
      content: "✓"; position: absolute; inset: 0; color: #fff; font-size: 11px;
      display: flex; align-items: center; justify-content: center;
    }
    .body { flex: 1; min-width: 0; }
    .t { font-size: 13px; line-height: 1.35; word-break: break-word; }
    li.item.done .t { color: var(--faint); text-decoration: line-through; }
    .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    .tag { font-size: 10px; padding: 1px 6px; border-radius: 20px; background: #eef1f6; color: var(--dim); }
    .tag.due { background: #fff3e2; color: var(--amber); }
    .tag.late { background: #fdeceb; color: var(--red); }
    .tag.carry { background: #eaf1ff; color: #3568b8; }
    .del {
      flex: 0 0 auto; border: 0; background: transparent; color: #c7ccd6;
      font-size: 15px; cursor: pointer; padding: 0 2px; line-height: 1;
    }
    .del:hover { color: var(--red); }
    .empty { font-size: 12px; color: var(--faint); padding: 14px 2px; line-height: 1.6; }
    /* ---------- 底部提醒 ---------- */
    footer {
      flex: 0 0 auto; border-top: 1px solid var(--line);
      padding: 9px 0 11px; display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: var(--dim); background: var(--bg);
    }
    footer .grow { flex: 1; line-height: 1.5; }
    footer b { color: #33405a; font-weight: 600; }
    .sw { position: relative; width: 34px; height: 18px; flex: 0 0 auto; }
    .sw input { opacity: 0; width: 0; height: 0; }
    .sw span {
      position: absolute; inset: 0; background: #d3d9e4; border-radius: 20px; cursor: pointer;
      transition: background .18s ease;
    }
    .sw span::after {
      content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px;
      background: #fff; border-radius: 50%; transition: transform .18s ease;
    }
    .sw input:checked + span { background: var(--blue); }
    .sw input:checked + span::after { transform: translateX(16px); }
    .mute { border: 0; background: transparent; color: #7b8494; font-size: 11px; cursor: pointer; text-decoration: underline; }
    .mute:disabled { color: #c3cad6; text-decoration: none; cursor: default; }
    input[type=text].edit {
      width: 100%; font: inherit; font-size: 13px; padding: 2px 4px;
      border: 1px solid #5b9bff; border-radius: 6px; outline: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="row1">
      <h1>今日待办</h1>
      <span class="date" id="date"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="stat"><span id="statLeft"></span><span id="statRight"></span></div>
  </header>

  <div class="add">
    <div class="line">
      <input id="inp" type="text" placeholder="写一条任务，回车添加" maxlength="120" />
      <button id="addBtn">添加</button>
    </div>
    <div class="opts">
      <div class="seg" id="typeSeg">
        <button data-type="required" class="on">必须完成</button>
        <button data-type="optional">有余力再做</button>
      </div>
      <input id="mins" type="number" min="1" max="1440" step="5" value="30" title="预计用时" />
      <span class="lbl">分</span>
      <input id="due" type="date" title="截止日期（可留空）" />
    </div>
  </div>

  <main id="list"></main>

  <footer>
    <div class="sw"><input id="remindSw" type="checkbox" /><span></span></div>
    <div class="grow">
      <b id="remindState">未完成提醒</b>
      <div id="remindDesc"></div>
    </div>
    <button class="mute" id="muteBtn">今天不再提醒</button>
  </footer>

  <script>
    const api = window.pet || {};
    let state = { today: '', items: [], stats: { total: 0, done: 0, pending: 0, minutes: 0, percent: 0 }, remind: {} };
    let addType = 'required';
    let editing = null;      // 正在内联编辑的 ref
    let busy = false;        // 自己触发的刷新，避免打断内联输入

    const $ = (id) => document.getElementById(id);

    // ---------- 渲染 ----------
    function tagsOf(it) {
      const out = [];
      if (it.overdue > 0) out.push(['late', `逾期 ${it.overdue} 天`]);
      else if (it.deadline === state.today) out.push(['due', '今天截止']);
      else if (it.deadline) out.push(['', `截止 ${it.deadline.slice(5)}`]);
      if (it.carried > 0) out.push(['carry', `顺延 ${it.carried} 天`]);
      if (it.start) out.push(['', it.start]);
      out.push(['', `${it.minutes} 分`]);
      return out;
    }

    function itemEl(it) {
      const li = document.createElement('li');
      li.className = 'item' + (it.done ? ' done' : '');

      const cb = document.createElement('div');
      cb.className = 'cb';
      cb.title = it.done ? '标记为未完成' : '标记完成';
      cb.addEventListener('click', () => act(() => api.dailyToggle(it.ref, !it.done)));

      const body = document.createElement('div');
      body.className = 'body';

      if (editing === it.ref) {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'edit';
        inp.value = it.title;
        inp.maxLength = 120;
        const commit = (save) => {
          if (editing !== it.ref) return;
          const v = inp.value.trim();
          editing = null;
          if (save && v && v !== it.title) act(() => api.dailyUpdate(it.ref, { title: v }));
          else render();
        };
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') commit(true);
          if (e.key === 'Escape') commit(false);
        });
        inp.addEventListener('blur', () => commit(true));
        body.appendChild(inp);
        setTimeout(() => { inp.focus(); inp.select(); }, 0);
      } else {
        const t = document.createElement('div');
        t.className = 't';
        t.textContent = it.title;
        t.title = '双击改标题';
        t.addEventListener('dblclick', () => { editing = it.ref; render(); });
        body.appendChild(t);

        const meta = document.createElement('div');
        meta.className = 'meta';
        tagsOf(it).forEach(([cls, text]) => {
          const s = document.createElement('span');
          s.className = 'tag' + (cls ? ' ' + cls : '');
          s.textContent = text;
          meta.appendChild(s);
        });
        body.appendChild(meta);
      }

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.title = '删除';
      del.addEventListener('click', () => act(() => api.dailyRemove(it.ref)));

      li.appendChild(cb);
      li.appendChild(body);
      li.appendChild(del);
      return li;
    }

    function group(title, items) {
      const box = document.createElement('div');
      box.className = 'grp';
      const h = document.createElement('div');
      h.className = 'gh';
      h.innerHTML = '<b>' + title + '</b><span>' + items.length + '</span>';
      box.appendChild(h);
      const ul = document.createElement('ul');
      items.forEach((it) => ul.appendChild(itemEl(it)));
      box.appendChild(ul);
      return box;
    }

    function render() {
      const { items, stats } = state;
      $('date').textContent = state.today || '';
      $('bar').style.width = stats.percent + '%';
      $('statLeft').textContent = stats.total
        ? `已完成 ${stats.done}/${stats.total}`
        : '今天还没有任务';
      $('statRight').textContent = stats.pending
        ? `还剩 ${stats.pending} 项 · 约 ${stats.minutes} 分钟`
        : (stats.total ? '全部完成 🎉' : '');

      const list = $('list');
      list.innerHTML = '';

      const pending = items.filter((i) => !i.done);
      const must = pending.filter((i) => i.type === 'required');
      const opt = pending.filter((i) => i.type === 'optional');
      const done = items.filter((i) => i.done);

      if (!items.length) {
        const p = document.createElement('div');
        p.className = 'empty';
        p.textContent = '还没有任务。写一条，回车就行 —— 没做完的会自动顺延到明天。';
        list.appendChild(p);
      }
      if (must.length) list.appendChild(group('必须完成', must));
      if (opt.length) list.appendChild(group('有余力再做', opt));
      if (done.length) list.appendChild(group('已完成', done));

      const r = state.remind || {};
      $('remindSw').checked = r.on !== false;
      $('remindState').textContent = r.on === false ? '未完成提醒已关闭' : '未完成提醒已开启';
      $('remindDesc').textContent = r.muted
        ? '今天已静音，明天自动恢复'
        : `每 ${r.everyMin || 10} 分钟 · ${String(r.from).padStart(2, '0')}:00–${String(r.to).padStart(2, '0')}:00 · 完成即停`;
      $('muteBtn').disabled = !!r.muted || r.on === false;
      $('muteBtn').textContent = r.muted ? '今天已静音' : '今天不再提醒';
    }

    // 所有写操作走这里：调 IPC 拿回最新状态再渲染
    async function act(fn) {
      if (busy) return;
      busy = true;
      try {
        const next = await fn();
        if (next && next.items) state = next;
      } catch (_) {}
      busy = false;
      render();
    }

    // ---------- 添加 ----------
    function add() {
      const v = $('inp').value.trim();
      if (!v) { $('inp').focus(); return; }
      const mins = Math.max(1, Math.min(1440, parseInt($('mins').value, 10) || 30));
      const due = $('due').value || '';
      $('inp').value = '';
      act(() => api.dailyAdd({ title: v, type: addType, minutes: mins, deadline: due }))
        .then(() => $('inp').focus());
    }
    $('addBtn').addEventListener('click', add);
    $('inp').addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
    $('typeSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-type]');
      if (!b) return;
      addType = b.dataset.type;
      [...$('typeSeg').children].forEach((x) => x.classList.toggle('on', x === b));
    });

    // ---------- 提醒开关 ----------
    $('remindSw').addEventListener('change', (e) => {
      act(() => api.dailySetRemind({ on: e.target.checked }));
    });
    $('muteBtn').addEventListener('click', () => act(() => api.dailyMuteToday()));

    // 主进程侧变化（托盘操作、跨日）时同步
    if (api.onDailyChanged) {
      api.onDailyChanged((s) => {
        if (busy || editing) return;
        if (s && s.items) { state = s; render(); }
      });
    }

    (async function init() {
      try { state = (await api.dailyGet()) || state; } catch (_) {}
      // 截止日期默认空，用户要就自己选
      render();
    })();
  </script>
</body>
</html>
